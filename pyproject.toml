[project]
name = "stateless-mcp-governance-router"
version = "0.2.0"
description = "Stateless MCP router exposing curated tools to agents over HTTP"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=4.0.3",
    "pydantic-settings>=2.5",
    "PyJWT>=2.8",
    "cryptography>=42.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
    "redis>=5.0",
]
redis = [
    "redis>=5.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"